name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request from a fork gets no secrets and a read-only token. Never switch this to pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Accuracy gate (replays recorded model answers, no model, no key)
        run: python -m app.eval.run --gate
