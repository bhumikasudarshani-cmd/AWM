# Tool configuration only. Dependencies live in requirements*.txt.

[tool.ruff]
target-version = "py312"
line-length = 140
# The eval cases are deliberately flawed (or deliberately clean) sample code, and the held-out cases must never be edited.
extend-exclude = ["app/eval/cases", "app/eval/heldout"]

[tool.ruff.lint]
# Start narrow so the first run is green: syntax errors, pyflakes (unused or undefined names), and the common E4/E7 checks.
# Widen one rule family at a time, each in its own pull request. Do not run `ruff format` over the whole repo.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# This file imports pytest fixtures from another test module, then takes them as test parameters.
# Ruff reads that as a redefinition. The long-term fix is to move those fixtures into conftest.py.
"tests/test_integration_llm_review.py" = ["F811"]
