services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["8000:8000"]
    depends_on: [redis]
    volumes: ["./app:/srv/app"]

  worker:
    build: .
    command: arq app.workers.tasks.WorkerSettings
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
    volumes:
      - ./app:/srv/app
      - ./fixtures_dump:/srv/fixtures_dump
